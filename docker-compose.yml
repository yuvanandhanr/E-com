services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecommerce_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_secret_password@postgres:5432/ecommerce_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=nexus_super_secret_jwt_key_2026_secure
      - WATCHPACK_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_secret_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  app_node_modules:
  app_next:
