services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecommerce_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_secret_password@postgres:5432/ecommerce_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=nexus_super_secret_jwt_key_2026_secure
      - WATCHPACK_POLLING=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=nexus-ecommerce
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_secret_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PostgreSQL Prometheus Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ecommerce_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://ecommerce_user:ecommerce_secret_password@postgres:5432/ecommerce_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Prometheus Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ecommerce_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis

  # Universal OpenTelemetry Collector Gateway (Plug-and-Play)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: ecommerce_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter (scraped by Grafana/Prometheus)

  # Prometheus Metrics Scraper & Time-Series Engine
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - postgres-exporter
      - redis-exporter
      - alertmanager

  # Prometheus Alertmanager (Alert Notification & Dispatch)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: ecommerce_alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # Grafana Visualization Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ecommerce_overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000" # Host port 3001 -> Grafana port 3000
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  app_node_modules:
  app_next:
  prometheus_data:
  grafana_data:
